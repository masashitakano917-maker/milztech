<!DOCTYPE html>
<html lang="ja" style="scroll-behavior: smooth;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MILZTECH | Creativity & Technology</title>
    <meta name="description" content="MILZTECHは、AI・クリエイティブ・テクノロジーを融合し、企業の成長と新しい体験設計を支援するクリエイティブテックカンパニーです。" />
    <meta name="theme-color" content="#000000" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Syne:wght@400..800&family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --bg: #000000;
        --fg: #ffffff;
        --accent: #ffffff;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg);
        color: var(--fg);
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }
      .font-syne { font-family: 'Syne', sans-serif; }
      .font-serif { font-family: 'Playfair Display', serif; }
      .mask-container {
        position: relative;
        overflow: hidden;
        display: block;
      }
      ::selection { background: #fff; color: #000; }
      .noise {
        position: fixed;
        inset: 0;
        z-index: 9999;
        pointer-events: none;
        opacity: 0.03;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }
      .atmosphere {
        position: fixed;
        inset: 0;
        z-index: -1;
        background: radial-gradient(circle at 50% -20%, #1a1a1a 0%, #000 70%);
      }
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: #000; }
      ::-webkit-scrollbar-thumb { background: #222; border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: #444; }
    </style>
  </head>
  <body>
    <div class="noise"></div>
    <div class="atmosphere"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
